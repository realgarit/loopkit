name: validate

on:
  push:
    branches: [main]
  pull_request:
  # dependabot-automerge starts this on main after its merge.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: node scripts/validate.mjs
